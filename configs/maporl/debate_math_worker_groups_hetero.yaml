recipe: maporl.debate_math.full_verl_tiny
mode: verl_plan

maporl:
  agent_count: 2
  agent_ids: ["agent_0", "agent_1"]
  model_ids: ["qwen05b", "tiny"]
  agent_loop_backend: synthetic_tq
  max_rounds: 2
  consensus_threshold: 2
  policy_separation: true
  collaboration_separation: true
  task_training: false
  reward_feedback: true
  rule_horizon: discounted_sum
  rule_agent_share: all
  rule_discount: 0.3
  alpha: [0.0, 0.0, 0.0, 0.0]
  worker_groups:
    qwen05b:
      model_path: ${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
      tokenizer_path: ${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
      trainable: true
      gpus: 1
    tiny:
      model_path: outputs/maporl_debate_math_tiny_assets/model
      tokenizer_path: outputs/maporl_debate_math_tiny_assets/model
      trainable: false
      gpus: 0

team:
  agent_count: 2
  max_turns: 2

protocol:
  type: debate
  communication_graph: fully_connected
  aggregation: consensus
  early_stop: true
  consensus_threshold: 2

credit:
  type: maporl_ppo_score_rule

prepare:
  tiny_verl_assets:
    enabled: true
    output_dir: outputs/maporl_debate_math_tiny_assets
    task_family: math
    train_size: 4
    val_size: 2
    overwrite: true

verl:
  enabled: true
  execute: false
  command_file: outputs/maporl_debate_math_worker_groups_hetero/run_verl_ppo.sh
  module: trajweave.backends.verl.main_ppo
  env:
    NO_PROXY: "localhost,127.0.0.1,::1"
    TOKENIZERS_PARALLELISM: "false"
    RAY_DEDUP_LOGS: "0"
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"
  overrides:
    - trainer.use_v1=true
    - trainer.v1.trainer_mode=sync
    - trainer.project_name=trajweave
    - trainer.experiment_name=maporl_debate_math_worker_groups_hetero
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.total_epochs=1
    - trainer.total_training_steps=1
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.logger=[console]
    - trainer.resume_mode=disable
    - trainer.default_local_dir=outputs/maporl_debate_math_worker_groups_hetero/checkpoints
    - data.train_files=outputs/maporl_debate_math_tiny_assets/train.jsonl
    - data.val_files=outputs/maporl_debate_math_tiny_assets/val.jsonl
    - data.train_batch_size=2
    - data.val_batch_size=2
    - data.max_prompt_length=96
    - data.max_response_length=32
    - data.dataloader_num_workers=0
    - data.filter_overlong_prompts=false
    - data.truncation=right
    - data.shuffle=false
    - actor_rollout_ref.model.path=${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
    - actor_rollout_ref.model.tokenizer_path=${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
    - +actor_rollout_ref.model.override_config.attn_implementation=eager
    - actor_rollout_ref.model.use_remove_padding=false
    - actor_rollout_ref.model.enable_gradient_checkpointing=false
    - actor_rollout_ref.rollout.name=hf
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.rollout.val_kwargs.n=2
    - actor_rollout_ref.rollout.prompt_length=96
    - actor_rollout_ref.rollout.response_length=32
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.calculate_log_probs=false
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=128
    - actor_rollout_ref.rollout.agent.num_workers=1
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=128
    - actor_rollout_ref.actor.use_torch_compile=false
    - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision={param_dtype:fp32,reduce_dtype:fp32,buffer_dtype:fp32}
    - actor_rollout_ref.actor.optim.lr=1e-6
    - algorithm.use_kl_in_reward=false
    - critic.enable=true
    - critic.strategy=fsdp
    - critic.model.path=${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
    - critic.model.tokenizer_path=${oc.env:TRAJWEAVE_QWEN05B_INSTRUCT_PATH,Qwen/Qwen2.5-0.5B-Instruct}
    - +critic.model.override_config.attn_implementation=eager
    - critic.model.use_remove_padding=false
    - critic.model.enable_gradient_checkpointing=false
    - critic.ppo_mini_batch_size=2
    - critic.ppo_micro_batch_size_per_gpu=1
    - critic.ppo_max_token_len_per_gpu=128
    - critic.forward_max_token_len_per_gpu=128
    - critic.optim.lr=1e-6
    - reward.num_workers=1
    - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
    - ray_kwargs.ray_init.num_cpus=12
