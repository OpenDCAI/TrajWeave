recipe: marti_mars2.single_mcts.fidelity
mode: verl_train

run:
  root_dir: outputs/marti_mars2_native_vllm_dual_actor_2step/runs
  name: native-vllm-dual-actor-2step-no-async-dp2-fixed

marti_mars2:
  max_num_nodes: 4
  initial_candidates: 2
  agent_ids: [generator, critic]
  model_ids: [policy_a, policy_b]
  worker_groups:
    policy_a:
      model_path: /data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
      tokenizer_path: /data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
    policy_b:
      model_path: /data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
      tokenizer_path: /data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
  agent_loop_backend: vllm_marti_tq
  multi_actor_training: true
  multi_actor_vllm:
    enabled: true
  async_updates: false
  enable_vllm_is_correction: true
  vllm_is_level: token
  vllm_is_truncated_threshold: 2.0

credit:
  mode: fidelity
  type: marti_mars2_fidelity_group_grpo

acceptance:
  enabled: true
  require_learning_signal: true
  require_multi_agent_routing: true
  require_multi_actor_weight_sync: true

prepare:
  tiny_verl_assets:
    enabled: true
    output_dir: outputs/marti_mars2_native_vllm_dual_actor_2step/assets
    task_family: controlled_code
    recipe_name: marti_mars2_native_vllm_dual_actor_2step_no_async
    train_size: 1
    val_size: 1
    overwrite: true

verl:
  enabled: true
  execute: true
  module: trajweave.backends.verl.main_ppo
  env:
    CUDA_VISIBLE_DEVICES: "0,1"
    HF_HOME: outputs/marti_mars2_native_vllm_dual_actor_2step/hf
    HF_DATASETS_CACHE: outputs/marti_mars2_native_vllm_dual_actor_2step/hf/datasets
    TRANSFORMERS_CACHE: outputs/marti_mars2_native_vllm_dual_actor_2step/hf/transformers
    XDG_CACHE_HOME: outputs/marti_mars2_native_vllm_dual_actor_2step/cache
    TMPDIR: outputs/marti_mars2_native_vllm_dual_actor_2step/tmp
    RAY_TMPDIR: outputs/marti_mars2_native_vllm_dual_actor_2step/ray
    NO_PROXY: localhost,127.0.0.1,::1
    TOKENIZERS_PARALLELISM: "false"
    VLLM_USE_V1: "1"
    RAY_DEDUP_LOGS: "0"
    PYTHONDONTWRITEBYTECODE: "1"
  overrides:
    - trainer.use_v1=true
    - trainer.v1.trainer_mode=sync
    - trainer.project_name=trajweave
    - trainer.experiment_name=marti_mars2_native_vllm_dual_actor_2step_no_async_dp2_fixed
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.total_epochs=2
    - trainer.total_training_steps=2
    - trainer.save_freq=2
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.logger=[console]
    - trainer.resume_mode=disable
    - trainer.default_local_dir=${oc.env:TRAJWEAVE_RUN_DIR}/checkpoints
    - data.train_files=outputs/marti_mars2_native_vllm_dual_actor_2step/assets/train.jsonl
    - data.val_files=outputs/marti_mars2_native_vllm_dual_actor_2step/assets/val.jsonl
    - data.train_batch_size=1
    - data.val_batch_size=1
    - data.max_prompt_length=128
    - data.max_response_length=96
    - data.dataloader_num_workers=0
    - data.filter_overlong_prompts=false
    - data.truncation=right
    - data.shuffle=false
    - actor_rollout_ref.model.path=/data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
    - actor_rollout_ref.model.tokenizer_path=/data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
    - +actor_rollout_ref.model.override_config.attn_implementation=eager
    - actor_rollout_ref.model.use_remove_padding=false
    - actor_rollout_ref.model.enable_gradient_checkpointing=false
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.prompt_length=128
    - actor_rollout_ref.rollout.response_length=96
    - actor_rollout_ref.rollout.max_model_len=256
    - actor_rollout_ref.rollout.max_num_seqs=8
    - actor_rollout_ref.rollout.max_num_batched_tokens=512
    - actor_rollout_ref.rollout.temperature=1.0
    - actor_rollout_ref.rollout.top_p=1.0
    - actor_rollout_ref.rollout.top_k=-1
    - +actor_rollout_ref.rollout.seed=42
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.data_parallel_size=2
    - actor_rollout_ref.rollout.pipeline_model_parallel_size=1
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.16
    - actor_rollout_ref.rollout.enforce_eager=true
    - actor_rollout_ref.rollout.calculate_log_probs=true
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=256
    - actor_rollout_ref.rollout.agent.num_workers=1
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=256
    - actor_rollout_ref.actor.use_torch_compile=false
    - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision={param_dtype:fp32,reduce_dtype:fp32,buffer_dtype:fp32}
    - actor_rollout_ref.actor.optim.lr=1e-6
    - algorithm.norm_adv_by_std_in_grpo=true
    - algorithm.use_kl_in_reward=false
    - critic.enable=false
    - reward.num_workers=1
    - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
    - ray_kwargs.ray_init.num_cpus=16
