recipe: marti_mars2.single_mcts.fidelity
mode: verl_train

marti_mars2:
  max_num_nodes: 2
  initial_candidates: 2
  agent_ids: [generator, critic]
  model_ids: [policy_a, policy_b]
  agent_loop_backend: vllm_marti_tq
  multi_actor_training: true
  multi_actor_vllm:
    enabled: true
  enable_vllm_is_correction: true
  vllm_is_level: token

credit:
  mode: fidelity
  type: marti_mars2_fidelity_group_grpo

acceptance:
  enabled: false

verl:
  enabled: true
  execute: false
  command_file: outputs/marti_mars2_stage1e_multi_agent_vllm_dryrun/verl_ppo.sh
  module: trajweave.backends.verl.main_ppo
  overrides:
    - trainer.use_v1=true
    - trainer.v1.trainer_mode=sync
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.total_epochs=1
    - trainer.total_training_steps=1
    - trainer.save_freq=1
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.resume_mode=disable
    - trainer.logger=[console]
    - actor_rollout_ref.rollout.name=vllm
    - actor_rollout_ref.rollout.calculate_log_probs=true
    - actor_rollout_ref.rollout.gpu_memory_utilization=0.20
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.rollout.val_kwargs.n=2
    - actor_rollout_ref.actor.ppo_mini_batch_size=1
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - algorithm.use_kl_in_reward=false
    - critic.enable=false
