recipe: mrlx.mgrpo_research_qa
mode: verl_plan

mrlx:
  agent_loop_backend: hf_local_tq
  explorer_agent: main_explorer
  adapter_agent: sub_adapter
  explorer_model_id: explorer_policy
  adapter_model_id: adapter_policy
  tool_name: search_and_browse
  research_rounds: 1
  adapter_delay_steps: 1
  explorer_format_bonus: 0.1
  adapter_format_bonus: 0.1
  tokenizer_mode: shared
  worker_groups:
    explorer_policy:
      model_path: outputs/mrlx_mgrpo_assets/model
      tokenizer_path: outputs/mrlx_mgrpo_assets/model
      gpus: 1
    adapter_policy:
      model_path: outputs/mrlx_mgrpo_assets/model
      tokenizer_path: outputs/mrlx_mgrpo_assets/model
      gpus: 1

prepare:
  tiny_verl_assets:
    enabled: true
    output_dir: outputs/mrlx_mgrpo_assets
    task_family: browse_qa
    train_size: 4
    val_size: 2
    overwrite: true

verl:
  enabled: true
  execute: false
  command_file: outputs/mrlx_mgrpo_2gpu/run_verl_ppo.sh
  stdout_path: outputs/mrlx_mgrpo_2gpu/verl_stdout.log
  stderr_path: outputs/mrlx_mgrpo_2gpu/verl_stderr.log
  module: trajweave.backends.verl.main_ppo
  env:
    HF_HOME: outputs/.hf_cache
    HF_DATASETS_CACHE: outputs/.hf_cache/datasets
    TRANSFORMERS_CACHE: outputs/.hf_cache/transformers
    NO_PROXY: localhost,127.0.0.1,::1
    TOKENIZERS_PARALLELISM: "false"
    RAY_DEDUP_LOGS: "0"
  overrides:
    - trainer.use_v1=true
    - trainer.project_name=trajweave
    - trainer.experiment_name=mrlx_mgrpo_2gpu
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.total_epochs=1
    - trainer.total_training_steps=2
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.logger=[console]
    - trainer.resume_mode=disable
    - trainer.default_local_dir=outputs/mrlx_mgrpo_2gpu/checkpoints
    - data.train_files=outputs/mrlx_mgrpo_assets/train.jsonl
    - data.val_files=outputs/mrlx_mgrpo_assets/val.jsonl
    - data.train_batch_size=2
    - data.val_batch_size=2
    - data.max_prompt_length=128
    - data.max_response_length=96
    - data.dataloader_num_workers=0
    - data.filter_overlong_prompts=false
    - data.truncation=right
    - data.shuffle=false
    - actor_rollout_ref.model.path=outputs/mrlx_mgrpo_assets/model
    - actor_rollout_ref.model.tokenizer_path=outputs/mrlx_mgrpo_assets/model
    - +actor_rollout_ref.model.override_config.attn_implementation=eager
    - actor_rollout_ref.model.use_remove_padding=false
    - actor_rollout_ref.model.enable_gradient_checkpointing=false
    - actor_rollout_ref.rollout.name=hf
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.rollout.val_kwargs.n=2
    - actor_rollout_ref.rollout.prompt_length=128
    - actor_rollout_ref.rollout.response_length=96
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.calculate_log_probs=false
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=256
    - actor_rollout_ref.rollout.agent.num_workers=1
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=256
    - actor_rollout_ref.actor.use_torch_compile=false
    - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision={param_dtype:fp32,reduce_dtype:fp32,buffer_dtype:fp32}
    - actor_rollout_ref.actor.optim.lr=1e-5
    - reward.num_workers=1
    - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
    - ray_kwargs.ray_init.num_cpus=8
