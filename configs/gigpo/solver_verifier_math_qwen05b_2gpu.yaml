recipe: gigpo.solver_verifier_math
mode: verl_train

gigpo:
  agent_loop_backend: hf_local_tq
  max_steps: 2
  gamma: 0.95
  step_advantage_weight: 1.0
  mode: mean_std_norm
  enable_similarity: false
  similarity_threshold: 0.95

prepare:
  tiny_verl_assets:
    enabled: true
    output_dir: outputs/gigpo_solver_verifier_math_qwen05b_2gpu_assets
    task_family: math
    recipe_name: gigpo_solver_verifier_math
    train_size: 2
    val_size: 2
    overwrite: true

verl:
  enabled: true
  execute: true
  command_file: outputs/gigpo_solver_verifier_math_qwen05b_2gpu/run_verl_ppo.sh
  stdout_path: outputs/gigpo_solver_verifier_math_qwen05b_2gpu/verl_stdout.log
  stderr_path: outputs/gigpo_solver_verifier_math_qwen05b_2gpu/verl_stderr.log
  module: trajweave.backends.verl.main_ppo
  env:
    CUDA_VISIBLE_DEVICES: "0,1"
    HF_HOME: outputs/.hf_cache
    HF_DATASETS_CACHE: outputs/.hf_cache/datasets
    TRANSFORMERS_CACHE: outputs/.hf_cache/transformers
    NO_PROXY: localhost,127.0.0.1,::1
    TOKENIZERS_PARALLELISM: "false"
    RAY_DEDUP_LOGS: "0"
    RAY_TMPDIR: /data/workspace/liuzhou/raytw
    NCCL_P2P_DISABLE: "1"
    NCCL_IB_DISABLE: "1"
  overrides:
    - trainer.use_v1=true
    - trainer.v1.trainer_mode=sync
    - trainer.project_name=trajweave
    - trainer.experiment_name=gigpo_solver_verifier_math_qwen05b_2gpu
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=2
    - trainer.total_epochs=2
    - trainer.total_training_steps=2
    - trainer.save_freq=2
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.logger=[console]
    - trainer.resume_mode=disable
    - trainer.default_local_dir=outputs/gigpo_solver_verifier_math_qwen05b_2gpu/checkpoints
    - data.train_files=outputs/gigpo_solver_verifier_math_qwen05b_2gpu_assets/train.jsonl
    - data.val_files=outputs/gigpo_solver_verifier_math_qwen05b_2gpu_assets/val.jsonl
    - data.train_batch_size=2
    - data.val_batch_size=2
    - data.max_prompt_length=128
    - data.max_response_length=32
    - data.dataloader_num_workers=0
    - data.filter_overlong_prompts=false
    - data.truncation=right
    - data.shuffle=false
    - actor_rollout_ref.model.path=/data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
    - actor_rollout_ref.model.tokenizer_path=/data/workspace/liuzhou/models/Qwen2.5-0.5B-Instruct
    - +actor_rollout_ref.model.override_config.attn_implementation=eager
    - actor_rollout_ref.model.use_remove_padding=false
    - actor_rollout_ref.model.enable_gradient_checkpointing=false
    - actor_rollout_ref.rollout.name=hf
    - actor_rollout_ref.rollout.n=4
    - actor_rollout_ref.rollout.val_kwargs.n=4
    - actor_rollout_ref.rollout.prompt_length=128
    - actor_rollout_ref.rollout.response_length=32
    - actor_rollout_ref.rollout.temperature=1.4
    - actor_rollout_ref.rollout.top_p=0.95
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.calculate_log_probs=false
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=192
    - actor_rollout_ref.rollout.agent.num_workers=1
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=192
    - actor_rollout_ref.actor.use_torch_compile=false
    - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision={param_dtype:fp32,reduce_dtype:fp32,buffer_dtype:fp32}
    - actor_rollout_ref.actor.optim.lr=1e-6
    - algorithm.use_kl_in_reward=false
    - critic.enable=false
    - reward.num_workers=1
    - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
    - ray_kwargs.ray_init.num_cpus=12
