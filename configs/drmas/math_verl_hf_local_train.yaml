recipe: doctor_mas_math
mode: verl_train

prepare:
  tiny_verl_assets:
    enabled: true
    output_dir: outputs/doctor_mas_verl_tiny_assets
    task_family: math
    train_size: 2
    val_size: 2
    overwrite: true

backend:
  type: rule
  device: cpu

team:
  max_turns: 2

rollout:
  rollouts_per_task: 1

export:
  dataproto_path: outputs/doctor_mas_verl_hf_local/math_samples.pt
  required: false

verl:
  enabled: true
  execute: true
  command_file: outputs/doctor_mas_verl_hf_local/run_verl_ppo_hf_local.sh
  stdout_path: outputs/doctor_mas_verl_hf_local/verl_stdout.log
  stderr_path: outputs/doctor_mas_verl_hf_local/verl_stderr.log
  module: trajweave.backends.verl.main_ppo
  env:
    CUDA_VISIBLE_DEVICES: "0"
    HF_HOME: "outputs/.hf_cache"
    HF_DATASETS_CACHE: "outputs/.hf_cache/datasets"
    TRANSFORMERS_CACHE: "outputs/.hf_cache/transformers"
    NO_PROXY: "localhost,127.0.0.1,::1"
    TOKENIZERS_PARALLELISM: "false"
    RAY_DEDUP_LOGS: "0"
  overrides:
    - trainer.use_v1=true
    - trainer.v1.trainer_mode=sync
    - trainer.project_name=trajweave
    - trainer.experiment_name=doctor_mas_math_verl_hf_local
    - trainer.nnodes=1
    - trainer.n_gpus_per_node=1
    - trainer.total_epochs=1
    - trainer.total_training_steps=1
    - trainer.save_freq=-1
    - trainer.test_freq=-1
    - trainer.val_before_train=false
    - trainer.logger=[console]
    - trainer.resume_mode=disable
    - trainer.default_local_dir=outputs/doctor_mas_verl_hf_local/checkpoints
    - data.train_files=outputs/doctor_mas_verl_tiny_assets/train.jsonl
    - data.val_files=outputs/doctor_mas_verl_tiny_assets/val.jsonl
    - data.train_batch_size=2
    - data.val_batch_size=2
    - data.max_prompt_length=64
    - data.max_response_length=24
    - data.dataloader_num_workers=0
    - data.filter_overlong_prompts=false
    - data.truncation=right
    - data.shuffle=false
    - actor_rollout_ref.model.path=outputs/doctor_mas_verl_tiny_assets/model
    - actor_rollout_ref.model.tokenizer_path=outputs/doctor_mas_verl_tiny_assets/model
    - +actor_rollout_ref.model.override_config.attn_implementation=eager
    - actor_rollout_ref.model.use_remove_padding=false
    - actor_rollout_ref.model.enable_gradient_checkpointing=false
    - actor_rollout_ref.rollout.name=hf
    - actor_rollout_ref.rollout.n=2
    - actor_rollout_ref.rollout.val_kwargs.n=2
    - actor_rollout_ref.rollout.prompt_length=64
    - actor_rollout_ref.rollout.response_length=24
    - actor_rollout_ref.rollout.tensor_model_parallel_size=1
    - actor_rollout_ref.rollout.calculate_log_probs=false
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_max_token_len_per_gpu=128
    - actor_rollout_ref.rollout.agent.num_workers=1
    - +actor_rollout_ref.rollout.agent.agent_loop_manager_class=trajweave.backends.verl.agent_loop.TrajWeaveAgentLoopManager
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.actor.ppo_max_token_len_per_gpu=128
    - actor_rollout_ref.actor.use_torch_compile=false
    - actor_rollout_ref.actor.fsdp_config.use_torch_compile=false
    - +actor_rollout_ref.actor.fsdp_config.mixed_precision={param_dtype:fp32,reduce_dtype:fp32,buffer_dtype:fp32}
    - actor_rollout_ref.actor.optim.lr=1e-5
    - algorithm.adv_estimator=grpo
    - ++algorithm.group_by_agent_id=true
    - algorithm.norm_adv_by_std_in_grpo=true
    - algorithm.use_kl_in_reward=false
    - critic.enable=false
    - reward.num_workers=1
    - transfer_queue.backend.SimpleStorage.num_data_storage_units=2
    - ray_kwargs.ray_init.num_cpus=8
    - +trajweave.recipe=doctor_mas_math
    - +trajweave.config=configs/drmas/math_verl_hf_local_train.yaml
    - +trajweave.coordination_protocol=solver_verifier_loop
    - +trajweave.trajectory_schema=multi_agent_turn_v1
    - +trajweave.credit_allocator=doctor_mas_agent_wise
    - +trajweave.verl_extensions=[drmas_agent_wise_grpo]
    - +trajweave.agent_loop_backend=hf_local_tq
    - +trajweave.turn_padding_multiple=2
