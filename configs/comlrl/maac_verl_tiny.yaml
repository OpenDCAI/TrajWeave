recipe: comlrl.maac
mode: verl_plan

comlrl:
  algorithm: maac
  agent_ids: [agent_0, agent_1]
  model_ids: [policy_0, policy_1]
  joint_mode: aligned
  max_turns: 2
  num_candidates: 1
  agent_loop_backend: hf_local_tq
  hf_local_dtype: fp32
  tokenizer_mode: shared
  actor_critic:
    topology: centralized
    critic_type: v
    max_length: 2048
    critic_routes:
      - critic_group: centralized
        actor_groups: [policy_0, policy_1]
        model_path: /path/to/centralized_critic
        tokenizer_path: /path/to/tokenizer
        gpus: 1
  worker_groups:
    policy_0:
      model_path: /path/to/actor_0
      tokenizer_path: /path/to/tokenizer
      trainable: true
      gpus: 1
    policy_1:
      model_path: /path/to/actor_1
      tokenizer_path: /path/to/tokenizer
      trainable: true
      gpus: 1

verl:
  enabled: true
  execute: false
  overrides:
    - trainer.use_v1=true
    - transfer_queue.enable=true
    - data.train_files=/path/to/train.parquet
    - data.val_files=/path/to/val.parquet
    - data.train_batch_size=3
    - data.val_batch_size=2
    - data.max_prompt_length=256
    - data.max_response_length=128
    - data.dataloader_num_workers=0
    - actor_rollout_ref.actor.ppo_mini_batch_size=2
    - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=1
    - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=1
    - critic.ppo_micro_batch_size_per_gpu=1
    - reward.num_workers=1
    - trainer.total_epochs=1
    - trainer.logger=[console]
    - trainer.n_gpus_per_node=3

prepare:
  tiny_verl_assets:
    enabled: false
