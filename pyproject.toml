[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowagent"
version = "1.0.0"
description = "A flexible LLM agent framework for building intelligent applications"
authors = [{ name = "Zhou Liu", email = "liuzhoul82@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm", "agent", "langchain", "ai", "framework", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # LangChain core - agent framework
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=0.6.7",
    "langgraph-checkpoint>=2.1.1",
    "langgraph-prebuilt>=0.6.4",

    # LLM providers
    "openai>=1.0.0",

    # Data handling
    "pydantic>=2.0.0",
    "pyyaml>=6.0",

    # Utilities
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "aiohttp>=3.8.0",
    "cloudpickle>=3.0.0",

    # Logging
    "colorlog>=6.7.0",
    "termcolor>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

# Optional vector store support
vector = [
    "faiss-cpu>=1.12.0",
]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.packages.find]
where = ["."]
include = ["flowagent*"]
exclude = ["tests*", "examples*"]
