[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trajweave"
dynamic = ["version"]
description = "TrajWeave: a Multi-Agent LLM RL framework built on the VERL training backend"
license = {text = "Apache-2.0"}
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
dependencies = [
    "accelerate",
    "cachetools",
    "codetiming",
    "datasets",
    "dill",
    "fastapi",
    "hydra-core",
    "numpy<2.0.0",
    "packaging>=20.0",
    "pandas",
    "peft",
    "pyarrow>=19.0.0",
    "pybind11",
    "pylatexenc",
    "PyYAML",
    "ray[default]>=2.41.0",
    "tensorboard",
    "tensordict>=0.8.0,<=0.10.0,!=0.9.0",
    "torchdata",
    "transformers",
    "TransferQueue==0.1.8",
    "uvicorn",
    "wandb",
]

[project.optional-dependencies]
test = ["pytest", "pre-commit", "py-spy", "pytest-asyncio", "pytest-rerunfailures"]
gpu = ["liger-kernel", "flash-attn"]
math = ["math-verify"]
vllm = ["tensordict>=0.8.0,<=0.10.0,!=0.9.0", "vllm>=0.8.5,<=0.12.0"]
sglang = ["tensordict>=0.8.0,<=0.10.0,!=0.9.0", "sglang[srt,openai]==0.5.8", "torch==2.9.1"]
mcore = ["mbridge"]
trtllm = ["tensorrt-llm>=1.2.0rc6"]

[project.urls]
Homepage = "https://github.com/OpenDCAI/TrajWeave"
Repository = "https://github.com/OpenDCAI/TrajWeave"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
isort = {known-first-party = ["verl", "trajweave"]}
select = ["E", "F", "UP", "B", "I", "G"]
ignore = [
    "F405",
    "F403",
    "E731",
    "B007",
    "UP032",
    "G004",
    "UP045",
    "UP035",
]

[tool.mypy]
pretty = true
ignore_missing_imports = true
explicit_package_bases = true
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "verl.trainer.config.algorithm",
    "verl.trainer.ppo.core_algos",
    "verl.trainer.ppo.reward",
    "verl.workers.reward_manager",
    "verl.workers.reward_manager.*",
]
ignore_errors = false

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "verl/version/version"}

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
verl = [
    "version/*",
    "trainer/config/*.yaml",
    "trainer/config/*/*.yaml",
    "experimental/*/config/*.yaml",
]
